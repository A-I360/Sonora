# Fly.io config — https://fly.io/docs/reference/configuration/
# Deploy:  fly launch --no-deploy   (accept this file)
#          fly volumes create sonora_data --size 1
#          fly deploy

app = "sonora"
primary_region = "jnb"   # Johannesburg — closest Fly region to Lagos. See `fly platform regions`.

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  SONORA_DATA_DIR = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options.response.headers]
    X-Frame-Options = "SAMEORIGIN"

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "5s"
    method = "GET"
    path = "/api/health"

# Persistent disk for db.json + wal.log. Without this the database resets
# on every deploy.
[[mounts]]
  source = "sonora_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
